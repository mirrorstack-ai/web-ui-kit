name: Storybook Deploy

on:
  workflow_run:
    workflows: [Storybook]
    types: [completed]
  pull_request:
    types: [closed]

permissions: {}

jobs:
  deploy-main:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    # Runner selection is data: unset RUNNER_LABELS falls back to GitHub-hosted ubuntu-24.04-arm; shared runner-group labels intentionally let any online box pick up the job.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04-arm"]') }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages

      - name: Download Storybook build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/storybook-static

      - name: Deploy to GitHub Pages
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'pr' -exec rm -rf {} +
          cp -r /tmp/storybook-static/* .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "deploy: update Storybook from $HEAD_SHA"
          git push origin gh-pages

  deploy-pr-preview:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04-arm"]') }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages

      - name: Download Storybook build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/storybook-static

      - name: Resolve pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed('Workflow run did not provide a valid commit SHA.');
              return;
            }

            const { data: pullRequests } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: headSha,
              });
            const matches = pullRequests.filter((pullRequest) =>
              pullRequest.base.repo.full_name ===
                `${context.repo.owner}/${context.repo.repo}` &&
              pullRequest.base.ref === 'main' &&
              pullRequest.head.sha === headSha
            );

            if (matches.length !== 1) {
              core.setFailed(
                `Expected one pull request for ${headSha}, found ${matches.length}.`
              );
              return;
            }

            core.setOutput('number', matches[0].number);

      - name: Deploy PR preview
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          preview_dir="pr/$PR_NUMBER"
          rm -rf -- "$preview_dir"
          mkdir -p -- "$preview_dir"
          cp -r /tmp/storybook-static/* "$preview_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "deploy: PR #$PR_NUMBER preview"
          git push origin gh-pages

      - name: Comment PR link
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              core.setFailed('Pull request number is invalid.');
              return;
            }
            const url = `https://mirrorstack-ai.github.io/web-ui-kit/pr/${prNumber}/`;
            const body = `**Storybook Preview:** ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes('Storybook Preview:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04-arm"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages

      - name: Remove PR preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          rm -rf -- "pr/$PR_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: clean up PR #$PR_NUMBER preview"
          git push
