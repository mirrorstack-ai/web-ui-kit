name: Release

on:
  pull_request:
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    timeout-minutes: 10  # p95 0.6m over 17 runs (gh-hosted); 2x p95
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determine if prerelease
        id: pre
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --prerelease=${{ steps.pre.outputs.prerelease }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔴 THE KIT IS BUILT FIRST, because module-preview compiles against its
      # TYPES and resolves them through package.json's `types`/`main` — both of
      # which point into dist/. Until this step runs, dist/ does not exist, and
      # module-preview's tsc answers TS2307 "Cannot find module
      # '@mirrorstack-ai/web-ui-kit'" plus a cascade of implicit-any errors from
      # the untyped import. The kit's own `prepublishOnly` does build it, but
      # that hook runs inside `pnpm publish` — two steps LATER.
      #
      # Measured on the 0.7.18 attempt (run 35079845215), which is also why
      # module-preview had never been published: this path has failed on every
      # train since it was added.
      - name: Build the kit
        run: pnpm build

      # 🔴 module-preview RIDES THIS TRAIN, and it must be built before it is
      # published: it compiles against the kit's freshly built types.
      - name: Build module-preview
        run: pnpm -C packages/module-preview build

      - name: Publish to GitHub Packages
        run: |
          pnpm publish --no-git-checks
          pnpm -C packages/module-preview publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for the npmjs token
        id: npmjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "enabled=$([ -n "$NPM_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Public mirror so anyone can install without a GitHub token. Internal
      # consumers keep resolving the scope from GitHub Packages (above).
      - name: Publish to npmjs
        if: steps.npmjs.outputs.enabled == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '%s\n' '@mirrorstack-ai:registry=https://registry.npmjs.org/' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc
          npm pkg set publishConfig.registry=https://registry.npmjs.org/ publishConfig.access=public
          pnpm publish --no-git-checks
          # The .npmrc above is repository-root and applies to the workspace,
          # so only the package's own publishConfig has to be redirected.
          npm pkg set --prefix packages/module-preview publishConfig.registry=https://registry.npmjs.org/ publishConfig.access=public
          pnpm -C packages/module-preview publish --no-git-checks
